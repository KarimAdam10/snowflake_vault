# De este fichero salen los DAGs de Airflow (airflow/dags/dv_pipelines.py).

# Reintentos por defecto de todas las tareas
defaults:
  retries: 1
  retry_delay_minutes: 1

# Reintentos de las tareas de carga (una por contrato). `entities` solo lista las excepciones.
entity_defaults: {retries: 2, retry_delay_minutes: 1}
entities:
  lineitem: {execution_timeout_minutes: 10}

# Etapas. `type` dice qué hacen y `depends_on` de cuáles dependen.
stages:
  landing:
    type: load_landing      # una tarea por contrato
  generate_models:
    type: generate_models   # genera los modelos de staging y Raw Vault
  dbt_staging:
    type: dbt               # cada etapa dbt ejecuta `dbt build` de su capa
    select: staging
    depends_on: [landing, generate_models]
  dbt_raw_vault:
    type: dbt
    select: raw_vault
    depends_on: [dbt_staging]
  dbt_business_vault:
    type: dbt
    select: business_vault
    depends_on: [dbt_raw_vault]
  dbt_mart:
    type: dbt
    select: mart
    depends_on: [dbt_business_vault]

# Cada pipeline es un DAG con las etapas que se listen
pipelines:
  dv_end_to_end:
    description: "Lote completo: CSV -> LANDING -> STAGING -> RAW_VAULT -> BUSINESS_VAULT -> MART"
    schedule: null
    tags: [end-to-end]
    stages: [landing, generate_models, dbt_staging, dbt_raw_vault, dbt_business_vault, dbt_mart]
