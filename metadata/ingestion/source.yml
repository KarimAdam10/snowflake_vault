# Orígenes de los datos. Cada contrato dice el suyo en `source.name`
# y `type` elige la función de landing/extract.py que trae el fichero.
sources:
  local_csv:
    type: local_folder
    # Una carpeta por periodo (YYYYMM). `{period}` es el sitio donde va el periodo.
    directory: "data/{period}"
