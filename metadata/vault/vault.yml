# Modelo del Raw Vault. De aquí se generan los modelos de dbt.
# Los nombres de columna son los de los contratos (metadata/ingestion/contracts).
#
#   hubs:             una clave de negocio
#   links:            relación entre hubs (child_key = clave que identifica la fila dentro del link)
#   satellites:       atributos con historia; cuelgan de un hub o de un link
#   reference_tables: catálogos de códigos, sin historia
#
# Una entidad alimenta como mucho un satélite.

hubs:
  hub_customer: {source: customer, key: [c_custkey]}
  hub_supplier: {source: supplier, key: [s_suppkey]}
  hub_part:     {source: part,     key: [p_partkey]}
  hub_order:    {source: orders,   key: [o_orderkey]}
  hub_inspection: {source: inspection, key: [i_inspectionkey]}

links:
  lnk_order_customer:
    source: orders
    hubs: {hub_order: [o_orderkey], hub_customer: [o_custkey]}
  lnk_partsupp:
    source: partsupp
    hubs: {hub_part: [ps_partkey], hub_supplier: [ps_suppkey]}
  lnk_lineitem:
    source: lineitem
    hubs: {hub_order: [l_orderkey], hub_part: [l_partkey], hub_supplier: [l_suppkey]}
    child_key: [l_linenumber]
  lnk_inspection_partsupp:
    source: inspection
    hubs: {hub_inspection: [i_inspectionkey], hub_part: [i_partkey], hub_supplier: [i_suppkey]}

satellites:
  sat_customer:      {parent: hub_customer, source: customer}
  sat_supplier:      {parent: hub_supplier, source: supplier}
  sat_part:          {parent: hub_part,     source: part}
  sat_order:         {parent: hub_order,    source: orders}
  sat_lnk_partsupp:  {parent: lnk_partsupp, source: partsupp}
  sat_lnk_lineitem:  {parent: lnk_lineitem, source: lineitem}
  sat_inspection:    {parent: hub_inspection, source: inspection}

reference_tables:
  ref_region: {source: region, key: [r_regionkey]}
  ref_nation: {source: nation, key: [n_nationkey]}
