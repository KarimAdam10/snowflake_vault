version: 2

models:
  - name: bsat_lineitem
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [LINEITEM_HK, LOAD_DATETIME]}
      # una fila por cada versión del satélite origen
      - dbt_utils.equal_rowcount:
          arguments: {compare_model: ref('sat_lnk_lineitem')}
    columns:
      - name: LINEITEM_HK
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('lnk_lineitem'), field: LINEITEM_HK}}
